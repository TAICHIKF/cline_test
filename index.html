    <main>
        <section>
            <h2>什么是MCP？</h2>
            <p>MCP（Model Context Protocol）是一个用于连接本地运行的MCP服务器的协议，提供额外的工具和资源来扩展系统能力。</p>
        </section>
        <section>
            <h2>主要功能</h2>
            <ul>
                <li>执行CLI命令</li>
                <li>读写文件</li>
                <li>搜索代码</li>
                <li>与GitHub等平台集成</li>
            </ul>
        </section>
        <section>
            <h2>使用场景</h2>
            <p>MCP工具可用于自动化任务、代码管理、项目部署等多个领域，提高开发效率。</p>
        </section>
